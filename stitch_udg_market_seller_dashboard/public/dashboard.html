<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UDG Market</title>
  <link rel="stylesheet" href="/app/assets/app.css">
  <script defer src="/app/assets/dashboard.js"></script>
</head>
<body class="app-shell">
  <header class="topbar"><div class="shell topbar-inner">
    <a class="brand" href="/">UDG <b>Market</b></a>
    <div class="top-actions">
      <span class="muted" id="user-name">Cargando perfil…</span>
      <button class="button secondary small" id="logout-button" type="button">Cerrar sesión</button>
    </div>
  </div></header>
  <main class="shell main app-main">
    <div class="app-heading">
      <div>
        <h1 class="heading" id="screen-title">UDG Market</h1>
        <p class="subheading" id="campus-label"></p>
      </div>
    </div>
    <p class="notice" id="global-notice" role="status" aria-live="polite"></p>
    <nav class="app-navigation" id="app-navigation" aria-label="Navegación principal">
      <button type="button" data-module-nav="seller-orders" data-seller-only hidden>
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v4H3zm2 6h14v12H5zm3 2v2h3v-2zm5 0v2h3v-2zm-5 4v2h3v-2zm5 0v2h3v-2z"/></svg>
        <span>Ventas</span>
      </button>
      <button type="button" data-module-nav="catalog">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9 5 4h14l2 5v2a3 3 0 0 1-2 2.83V20H5v-6.17A3 3 0 0 1 3 11zm2.4-3-1.2 3h15.6l-1.2-3zM7 14v4h10v-4a3 3 0 0 1-5-1 3 3 0 0 1-5 1z"/></svg>
        <span>Explorar</span>
      </button>
      <button type="button" data-module-nav="inventory" data-seller-only hidden>
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zm2 2v4h4V6zm6 0v4h6V6zm-6 6v6h4v-6zm6 0v6h6v-6z"/></svg>
        <span>Inventario</span>
      </button>
      <button type="button" data-module-nav="buyer-orders">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l1 3h3l-1.5 13h-15L3 7h3zm1.4 3h7.2l-.5-1.5H8.9zM8 10v2a4 4 0 0 0 8 0v-2h-2v2a2 2 0 0 1-4 0v-2z"/></svg>
        <span>Mis pedidos</span>
      </button>
      <button type="button" data-module-nav="my-profile">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/></svg>
        <span>Mi perfil</span>
      </button>
      <label class="module-picker">Más pantallas
        <select id="module-picker" aria-label="Abrir otra pantalla">
          <option value="">Seleccionar</option>
          <optgroup label="Explorar">
            <option value="catalog">Productos del campus</option>
          </optgroup>
          <optgroup label="Ventas" data-seller-only hidden>
            <option value="seller-orders">Pedidos activos (vendedor)</option>
          </optgroup>
          <optgroup label="Inventario" data-seller-only hidden>
            <option value="inventory">Mi inventario</option>
            <option value="inventory-stock">Inventario y stock (perfil)</option>
            <option value="inventory-stock-alt">Inventario y stock</option>
            <option value="edit-product">Editar producto</option>
          </optgroup>
          <optgroup label="Compras">
            <option value="buyer-orders">Mis pedidos y reservas</option>
            <option value="cancel-reservation">Cancelar reserva</option>
            <option value="delivery-pass">Pase de entrega</option>
            <option value="post-delivery-review">Valorar una compra</option>
          </optgroup>
          <optgroup label="Perfil">
            <option value="my-profile">Editar mi perfil</option>
            <option value="settings">Perfil y ajustes</option>
            <option value="seller-profile">Perfil público del vendedor</option>
          </optgroup>
        </select>
      </label>
    </nav>
    <section class="original-view" aria-label="Pantalla de UDG Market">
      <iframe id="module-frame" title="Pantalla de UDG Market" src="about:blank" allow="camera"></iframe>
    </section>
  </main>
</body>
</html>
