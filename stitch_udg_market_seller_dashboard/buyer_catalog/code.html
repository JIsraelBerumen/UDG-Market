<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Productos del campus - UDG Market</title>
  <link rel="stylesheet" href="/app/assets/catalog.css">
  <script defer src="/app/assets/catalog.js"></script>
</head>
<body>
  <main class="catalog-shell">
    <header class="catalog-header">
      <p class="eyebrow">UDG MARKET <span aria-hidden="true">/</span> EXPLORAR</p>
      <div class="heading-row">
        <div>
          <h1>Encuentra algo bueno</h1>
          <p class="intro">Descubre lo que se vende hoy en tu campus.</p>
        </div>
        <span class="campus-pill">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
          <span id="campus-name">Tu campus</span>
        </span>
      </div>
    </header>

    <section class="search-panel" aria-label="Buscar productos">
      <form id="search-form" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.65 13.38L20.77 22 22 20.77l-5.62-5.62A7.5 7.5 0 0 0 10.5 3zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"/></svg>
        <label class="sr-only" for="product-search">Buscar productos</label>
        <input id="product-search" name="q" type="search" maxlength="100" placeholder="¿Qué se te antoja o hace falta?" autocomplete="off">
        <button id="clear-search" class="clear-search" type="button" aria-label="Limpiar búsqueda" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18.3 5.71-1.42-1.42L12 9.17 7.12 4.29 5.7 5.71 10.59 10.6 5.7 15.47l1.42 1.42L12 12.01l4.88 4.88 1.42-1.42-4.88-4.88z"/></svg>
        </button>
      </form>
      <div class="filter-heading">
        <h2>Categorías</h2>
        <span id="result-count" aria-live="polite"></span>
      </div>
      <div class="category-list" id="category-list" aria-label="Filtrar por categoría">
        <button class="category-chip is-selected" type="button" data-category-id="" aria-pressed="true">Todo</button>
      </div>
    </section>

    <section class="listing-section" aria-labelledby="listing-title">
      <div class="listing-heading">
        <div>
          <p class="eyebrow">HECHO POR LA COMUNIDAD</p>
          <h2 id="listing-title">Disponible cerca de ti</h2>
        </div>
        <span class="live-indicator"><span></span> En venta</span>
      </div>
      <div id="catalog-message" class="catalog-message" role="status" aria-live="polite">Cargando productos…</div>
      <div id="product-grid" class="product-grid"></div>
    </section>
  </main>

  <dialog id="product-dialog" class="product-dialog" aria-labelledby="dialog-title">
    <div class="dialog-content">
      <button id="close-dialog" class="dialog-close" type="button" aria-label="Cerrar detalles">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18.3 5.71-1.42-1.42L12 9.17 7.12 4.29 5.7 5.71 10.59 10.6 5.7 15.47l1.42 1.42L12 12.01l4.88 4.88 1.42-1.42-4.88-4.88z"/></svg>
      </button>
      <div id="dialog-product"></div>
    </div>
  </dialog>

  <nav class="catalog-bottom-nav" aria-label="Navegación inferior">
    <a href="/app/dashboard.html#seller-orders" aria-label="Ventas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10l1 3h3l-1.5 13h-15L3 7h3zm1.4 3h7.2l-.5-1.5H8.9zM8 10v2a4 4 0 0 0 8 0v-2h-2v2a2 2 0 0 1-4 0v-2z"/></svg>
      <span>Ventas</span>
    </a>
    <a href="/app/dashboard.html#catalog" aria-label="Explorar" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9 5 4h14l2 5v2a3 3 0 0 1-2 2.83V20H5v-6.17A3 3 0 0 1 3 11zm2.4-3-1.2 3h15.6l-1.2-3zM7 14v4h10v-4a3 3 0 0 1-5-1 3 3 0 0 1-5 1z"/></svg>
      <span>Explorar</span>
    </a>
    <a href="/app/dashboard.html#inventory" aria-label="Inventario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4zm2 2v4h4V6zm6 0v4h6V6zm-6 6v6h4v-6zm6 0v6h6v-6z"/></svg>
      <span>Inventario</span>
    </a>
    <a href="/app/dashboard.html#profile" aria-label="Perfil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/></svg>
      <span>Perfil</span>
    </a>
  </nav>
</body>
</html>
