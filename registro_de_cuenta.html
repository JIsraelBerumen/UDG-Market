<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Crear Cuenta - UDG Market</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome para íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Tipografía Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Ocultar flecha nativa de los select para usar la de FontAwesome */
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen flex items-center justify-center p-4 md:p-8 antialiased">
    
    <!-- Contenedor Principal (Tarjeta) -->
    <!-- Adaptación responsiva: max-w-2xl para desktop (permite 2 columnas) -->
    <main class="w-full max-w-2xl bg-white rounded-[24px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-6 md:p-10 relative overflow-hidden">
        
        <!-- Detalle visual superior -->
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-[#FF7A59] to-[#FBBF24]"></div>

        <!-- Heurística de Nielsen 1 y 3: Control del usuario (Volver) y Visibilidad del estado (Paso único) -->
        <div class="flex items-center justify-between mb-6">
            <a href="login.html" class="text-slate-400 hover:text-[#1E293B] transition-colors flex items-center gap-2 text-sm font-bold w-max">
                <i class="fa-solid fa-arrow-left"></i> Volver al inicio
            </a>
            
            <span class="bg-slate-50 border border-slate-100 text-[#1E293B] text-[11px] font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
                <span class="w-2 h-2 bg-[#34D399] rounded-full animate-pulse"></span> Paso único
            </span>
        </div>

        <!-- Encabezado -->
        <div class="mb-8 text-center md:text-left">
            <h1 class="text-2xl md:text-3xl font-extrabold text-[#1E293B] tracking-tight">Crear cuenta</h1>
            <p class="text-sm text-slate-500 font-medium mt-1">Únete a la red de comercio de estudiantes de la UDG.</p>
        </div>

        <!-- Ley de Hick: Formulario con solo 5 campos esenciales -->
        <form class="space-y-5">
            
            <!-- Campo 1: Nombre (1 Columna completa) -->
            <div class="space-y-1.5">
                <label for="nombre" class="text-[12px] font-bold text-[#1E293B] ml-1 uppercase tracking-wide">Nombre Completo</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-regular fa-user text-slate-400"></i>
                    </div>
                    <!-- Ley de Fitts: Inputs grandes (p-3.5) -->
                    <input type="text" id="nombre" placeholder="Ej. Lucía Martínez" class="w-full bg-slate-50 border border-slate-200 text-[#1E293B] text-sm rounded-2xl focus:ring-2 focus:ring-[#FF7A59]/20 focus:border-[#FF7A59] block pl-11 p-3.5 transition-all outline-none" required>
                </div>
            </div>

            <!-- Grid Responsivo: 1 columna en móvil, 2 en desktop para campos cortos -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                
                <!-- Campo 2: Código -->
                <div class="space-y-1.5">
                    <label for="codigo" class="text-[12px] font-bold text-[#1E293B] ml-1 uppercase tracking-wide">Código de Estudiante</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-id-badge text-slate-400"></i>
                        </div>
                        <input type="text" id="codigo" placeholder="2190..." class="w-full bg-slate-50 border border-slate-200 text-[#1E293B] text-sm rounded-2xl focus:ring-2 focus:ring-[#FF7A59]/20 focus:border-[#FF7A59] block pl-11 p-3.5 transition-all outline-none" required>
                    </div>
                </div>

                <!-- Campo 3: Centro Universitario -->
                <div class="space-y-1.5">
                    <label for="centro" class="text-[12px] font-bold text-[#1E293B] ml-1 uppercase tracking-wide">Centro Universitario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-building-columns text-slate-400"></i>
                        </div>
                        <select id="centro" class="w-full bg-slate-50 border border-slate-200 text-[#1E293B] text-sm rounded-2xl focus:ring-2 focus:ring-[#FF7A59]/20 focus:border-[#FF7A59] block pl-11 p-3.5 transition-all outline-none cursor-pointer" required>
                            <option value="" disabled selected>Selecciona tu campus...</option>
                            <option value="CUCEA">CUCEA (Ciencias Económico Administrativas)</option>
                            <option value="CUCEI">CUCEI (Ciencias Exactas e Ingenierías)</option>
                            <option value="CUTLAJO">CUTlajomulco</option>
                            <option value="CUTLAQUEPAQUE">CUTlaquepaque</option>
                            <option value="CUAAD">CUAAD (Arte, Arquitectura y Diseño)</option>
                            <option value="CUCS">CUCS (Ciencias de la Salud)</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-chevron-down text-slate-400 text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Campo 4: Correo Institucional -->
            <div class="space-y-1.5">
                <label for="email" class="text-[12px] font-bold text-[#1E293B] ml-1 uppercase tracking-wide">Correo Institucional</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-regular fa-envelope text-slate-400"></i>
                    </div>
                    <input type="email" id="email" placeholder="nombre.apellido@alumnos.udg.mx" class="w-full bg-slate-50 border border-slate-200 text-[#1E293B] text-sm rounded-2xl focus:ring-2 focus:ring-[#FF7A59]/20 focus:border-[#FF7A59] block pl-11 p-3.5 transition-all outline-none" required>
                </div>
                <!-- Heurística de Nielsen 2: Prevención de errores -->
                <p class="text-[11px] text-slate-500 ml-1 font-medium flex items-center gap-1.5 mt-1">
                    <i class="fa-solid fa-circle-info text-[#FBBF24]"></i> Debe terminar forzosamente en @alumnos.udg.mx
                </p>
            </div>

            <!-- Campo 5: Contraseña -->
            <div class="space-y-1.5">
                <label for="password" class="text-[12px] font-bold text-[#1E293B] ml-1 uppercase tracking-wide">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-slate-400"></i>
                    </div>
                    <input type="password" id="password" placeholder="Crea una contraseña segura" class="w-full bg-slate-50 border border-slate-200 text-[#1E293B] text-sm rounded-2xl focus:ring-2 focus:ring-[#FF7A59]/20 focus:border-[#FF7A59] block pl-11 p-3.5 transition-all outline-none" required>
                    <button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-[#1E293B] transition-colors">
                        <i class="fa-regular fa-eye-slash"></i>
                    </button>
                </div>
                <!-- Heurística de Nielsen 2: Prevención de errores -->
                <p class="text-[11px] text-slate-400 ml-1 font-medium">Mínimo 8 caracteres, incluye letras y números.</p>
            </div>

            <!-- Botón de Registro (Ley de Fitts: Gigante, claro, alto contraste) -->
            <button type="submit" class="w-full bg-[#FF7A59] hover:bg-[#E6694A] text-white font-extrabold rounded-2xl text-[15px] px-5 py-4 text-center transition-transform active:scale-[0.98] shadow-lg shadow-orange-200 mt-4 flex justify-center items-center gap-2">
                Crear mi cuenta <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
            
        </form>

        <!-- Legales -->
        <p class="text-center text-[10px] text-slate-400 font-medium mt-6">
            Al registrarte aceptas los <a href="#" class="text-[#1E293B] underline hover:text-[#FF7A59]">Términos de Servicio</a> y la <a href="#" class="text-[#1E293B] underline hover:text-[#FF7A59]">Política de Privacidad</a> del campus.
        </p>
    </main>

</body>
</html>
